          if [[ "${1:-}" == "wg" ]]; then
            cat <<"OUT"
          PrivateKey: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          Password (PublicKey): Hx4dHBsaGRgXFhUUExIREA8ODQwLCgkIBwYFBAMCAQA=
          Hash32: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          OUT
            exit 0
          fi
          exit 1
          EOF
            chmod +x "$tmp/xray"
            PATH="$tmp:$PATH"
            wg() { return 1; }
            pair="$(generate_warp_keypair)"
            [[ "${pair%%$'"'"'\n'"'"'*}" == "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=" ]]
            [[ "${pair#*$'"'"'\n'"'"'}" == "Hx4dHBsaGRgXFhUUExIREA8ODQwLCgkIBwYFBAMCAQA=" ]]
